<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — UniStay</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">
      <div class="logo-icon">U</div>
      <span>Uni<span class="text-gradient">Stay</span></span>
    </div>

    <div class="auth-card">
      <div class="auth-icon">📝</div>
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Register to apply for hostel accommodation</p>
      </div>

      <div id="registerError" class="alert alert-danger hidden" style="margin-bottom: 18px;">
        <span>⚠️</span>
        <span id="registerErrorText"></span>
      </div>
      <div id="registerSuccess" class="alert alert-success hidden" style="margin-bottom: 18px;">
        <span>✅</span>
        <span id="registerSuccessText"></span>
      </div>

      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" class="form-input" id="regName" placeholder="Enter your full name" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-with-icon">
            <span class="input-icon">✉️</span>
            <input type="email" class="form-input" id="regEmail" placeholder="you@university.com" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="input-with-icon">
            <span class="input-icon">📞</span>
            <input type="tel" class="form-input" id="regPhone" placeholder="+91 XXXXX XXXXX">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Room Preference</label>
          <select class="form-select" id="regRoomType">
            <option value="">Select room type</option>
            <option value="single">Single Room (₹8,000/mo)</option>
            <option value="double">Double Sharing (₹6,000/mo)</option>
            <option value="triple">Triple Sharing (₹4,500/mo)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-input" id="regPassword" placeholder="Create a password" required minlength="6">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="registerBtn">
          Create Account →
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const errorDiv = document.getElementById('registerError');
      const errorText = document.getElementById('registerErrorText');
      const successDiv = document.getElementById('registerSuccess');
      const successText = document.getElementById('registerSuccessText');

      btn.textContent = 'Creating account...';
      btn.disabled = true;
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            phone: document.getElementById('regPhone').value,
            password: document.getElementById('regPassword').value,
            roomType: document.getElementById('regRoomType').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        successText.textContent = 'Account created successfully! Redirecting...';
        successDiv.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = '/student.html';
        }, 1500);
      } catch (err) {
        errorText.textContent = err.message;
        errorDiv.classList.remove('hidden');
        btn.textContent = 'Create Account →';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
